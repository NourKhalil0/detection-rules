title: SAM Registry Hive Dump via Reg.exe
id: 7c8d9e0f-1a2b-3c4d-5e6f-7a8b9c0d1e2f
status: stable
description: Detects dumping of the SAM registry hive using reg.exe save command
author: Nour Mo
references:
  - https://attack.mitre.org/techniques/T1003/002/
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\reg.exe'
    CommandLine|contains:
      - 'save'
      - 'hklm\sam'
  condition: selection
level: critical
tags:
  - attack.credential_access
  - attack.t1003.002
