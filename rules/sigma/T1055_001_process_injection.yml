title: Process Injection via CreateRemoteThread
id: 5a6b7c8d-9e0f-1a2b-3c4d-5e6f7a8b9c0d
status: stable
description: Detects suspicious CreateRemoteThread API calls targeting remote processes
author: Nour Mo
references:
  - https://attack.mitre.org/techniques/T1055/001/
logsource:
  category: create_remote_thread
  product: windows
detection:
  selection:
    TargetImage|endswith:
      - '\explorer.exe'
      - '\svchost.exe'
  filter_debugger:
    SourceImage|endswith: '\devenv.exe'
  condition: selection and not filter_debugger
level: high
tags:
  - attack.defense_evasion
  - attack.privilege_escalation
  - attack.t1055.001
